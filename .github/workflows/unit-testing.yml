name: Lab Unit Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore reference tests
        env:
          REFERENCE_TESTS: https://raw.githubusercontent.com/Java-Fall2026/java-2025-syntax/main/src/test/java/ua/university/BasicOperatorsTest.java
        run: |
          curl -sSL --fail -o src/test/java/ua/university/BasicOperatorsTest.java "$REFERENCE_TESTS"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test
